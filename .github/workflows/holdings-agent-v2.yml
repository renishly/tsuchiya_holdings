name: Holdings agent v2

on:
  schedule:
    - cron: "17 7,21 * * *"   # ~16:17 JST (after the 15:30 TSE close) and ~06:17 JST (daily filings check)
  workflow_dispatch:
    inputs:
      mode:
        description: "scheduled, test, or phase=P1..P9"
        required: false
        default: "scheduled"
      instruction:
        description: "Optional instruction for the orchestrator (blank = normal run)"
        required: false
        default: ""
      referee_mode:
        description: "Referee models for the consensus debate: off or shadow (blank = repository variable)"
        required: false
        default: ""
  repository_dispatch:
    types: [run-agent]

permissions:
  contents: write

concurrency:
  group: holdings-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/app/requirements.txt

      - run: pip install -r v2/app/requirements.txt

      - name: Run agent
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          MODEL: ${{ vars.MODEL }}
          FALLBACK_MODELS: ${{ vars.FALLBACK_MODELS }}
          FREE_ONLY: ${{ vars.FREE_ONLY }}
          MAX_STEPS: ${{ vars.MAX_STEPS }}
          MAX_LLM_REQUESTS: ${{ vars.MAX_LLM_REQUESTS }}
          REVIEW_THRESHOLD: ${{ vars.REVIEW_THRESHOLD }}
          CONSENSUS_ROUNDS: ${{ vars.CONSENSUS_ROUNDS }}
          CONSENSUS_AGREE_WITHIN: ${{ vars.CONSENSUS_AGREE_WITHIN }}
          CONSENSUS_WEIGHTING: ${{ vars.CONSENSUS_WEIGHTING }}
          REFEREE_MODE: ${{ github.event.inputs.referee_mode || vars.REFEREE_MODE }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
          DASHBOARD_API_KEY_CA: ${{ secrets.DASHBOARD_API_KEY_CA }}
          DASHBOARD_API_KEY_DEBATER_A: ${{ secrets.DASHBOARD_API_KEY_DEBATER_A }}
          DASHBOARD_API_KEY_DEBATER_B: ${{ secrets.DASHBOARD_API_KEY_DEBATER_B }}
          AGENT_MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'scheduled' }}
          AGENT_INSTRUCTION: ${{ github.event.inputs.instruction || github.event.client_payload.instruction || '' }}
          TSUCHIYA_GIT: "0"            # the next step commits; the pipeline does not push by itself
        run: python v2/app/agent.py

      - name: Commit outputs
        if: ${{ always() && (github.event.inputs.mode || github.event.client_payload.mode || 'scheduled') != 'test' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/app/data v2/app/reports v2/app/state v2/app/logs v2/app/raw v2/app/inputs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "agent v2 run $(date -u +%FT%H%MZ) (${{ github.event_name }})"
          # Normal pushes only (never force). If main moved, rebase our data commit on top once.
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
